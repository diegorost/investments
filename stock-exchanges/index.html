<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Markets</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #121622;
    --surface-2: #13151f;
    --border: #1a1d27;
    --text: #e0e0e0;
    --muted: #555b6b;
    --muted-2: #444;
    --positive: #4ade80;
    --negative: #f87171;
    --accent: #4f8ef7;
    --na: #2a2d3a;
  }

  body.theme-light {
    --bg: #f7f9fc;
    --surface: #ffffff;
    --surface-2: #eef2f7;
    --border: #d7deea;
    --text: #0f172a;
    --muted: #667085;
    --muted-2: #8a94a6;
    --positive: #0f9d58;
    --negative: #d64545;
    --accent: #2563eb;
    --na: #cbd5e1;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 40px 20px;
    transition: background-color .2s ease, color .2s ease;
  }

  .container { max-width: 1100px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; align-items: start; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
  .meta { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
  .dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .theme-btn, .refresh-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.78rem;
    padding: 5px 12px;
    cursor: pointer;
    transition: border-color .2s, color .2s, background-color .2s, transform .15s ease;
  }
  .theme-btn:hover, .refresh-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .section { margin-bottom: 32px; }
  .section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-2); margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 0.7rem; color: var(--muted-2); text-transform: uppercase; letter-spacing: .07em; padding: 0 6px 10px; text-align: left; }
  thead th:not(:first-child) { text-align: right; }
  tbody tr:hover td { background: var(--surface-2); }
  tbody td { padding: 11px 6px; border-bottom: 1px solid var(--border); font-size: 0.94rem; transition: background .12s; }
  tbody tr:last-child td { border-bottom: none; }
  tbody td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  .market-name { font-weight: 600; color: var(--text); }
  .value { color: var(--muted); }
  .pos { color: var(--positive); }
  .neg { color: var(--negative); }
  .na { color: var(--na); }
  .unavail { color: var(--muted-2); font-size: 0.8rem; }
  .empty-msg { padding: 48px 0; text-align: center; color: var(--muted-2); font-size: 0.88rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>World Markets</h1>
    <div class="meta">
      <span class="dot loading" id="dot"></span>
      <span id="updated">Loading...</span>
      <button class="theme-btn" id="themeBtn" type="button">Light theme</button>
      <button class="refresh-btn" onclick="reload()">&#8635; Refresh</button>
    </div>
  </header>

  <div id="content"><div class="empty-msg">Loading...</div></div>
</div>

<script>
const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname)
  ? 'http://localhost:8787'
  : 'https://stock-exchanges-api.diegointheworks.workers.dev';
const THEME_KEY = 'stock-exchanges-theme';

const fmt = (n, d) => n == null ? '<span class="na">—</span>'
  : n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = n => n > 0 ? '+' : '';
const cls = n => n == null ? '' : n >= 0 ? 'pos' : 'neg';

function setTheme(theme) {
  document.body.classList.toggle('theme-light', theme === 'light');
  localStorage.setItem(THEME_KEY, theme);
  document.getElementById('themeBtn').textContent = theme === 'light' ? 'Dark theme' : 'Light theme';
}

function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  setTheme(saved === 'light' ? 'light' : 'dark');
}

function renderSection(title, markets) {
  if (!markets.length) return '';
  const rows = markets.map(m => {
    const d = m.dec || 2;
    const valCell = (m.error && m.value == null)
      ? `<span class="unavail">${m.error}</span>`
      : `<span class="value">${fmt(m.value, d)}</span>`;
    const chgCell = m.change == null ? '<span class="na">—</span>'
      : `<span class="${cls(m.change)}">${sign(m.change)}${fmt(m.change, d)}</span>`;
    const pctCell = m.pct == null ? '<span class="na">—</span>'
      : `<span class="${cls(m.pct)}">${sign(m.pct)}${fmt(m.pct, 2)}%</span>`;
    const iconHtml = m.icon ? `<span style="margin-right:7px;font-size:1.05em;vertical-align:middle">${m.icon}</span>` : '';
    const flagList = m.flags || (m.flag ? [m.flag] : []);
    const flagsHtml = flagList.map((f, i) =>
      `<img src="https://flagcdn.com/20x15/${f}.png" width="20" height="15" style="vertical-align:middle;border-radius:2px;${i < flagList.length - 1 ? 'margin-right:3px' : 'margin-right:7px'}">`
    ).join('');
    return `<tr>
      <td class="market-name">${iconHtml}${flagsHtml}${m.name}</td>
      <td>${valCell}</td><td>${chgCell}</td><td>${pctCell}</td>
    </tr>`;
  }).join('');
  return `<div class="section">
    <div class="section-title">${title}</div>
    <table>
      <thead><tr><th>Market</th><th>Value</th><th>Change</th><th>% Change</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function render(data) {
  const markets = data.markets;
  const us = markets.filter(m => m.region === 'US');
  const latamBase = markets.filter(m => m.region === 'LATAM');
  const chile = markets.filter(m => m.region === 'CHILE');
  const latam = [...latamBase, ...chile];
  const metals = markets.filter(m => m.region === 'FUTURES');
  const forex = markets.filter(m => m.region === 'FOREX');
  const miners = markets.filter(m => m.region === 'MINERS');
  document.getElementById('content').innerHTML = `
    <div class="grid">
      <div>
        ${renderSection('United States', us)}
        ${renderSection('Forex (1 USD = X)', forex)}
        ${renderSection('Latin America', latam)}
      </div>
      <div>
        ${renderSection('Futures', metals)}
        ${renderSection('Miners', miners)}
      </div>
    </div>`;
  document.getElementById('updated').textContent = 'Updated: ' + data.updated;
  document.getElementById('dot').className = 'dot';
}

async function load() {
  document.getElementById('dot').className = 'dot loading';
  try {
    const res = await fetch(`${API_BASE}/api/yahoo`);
    const data = await res.json();
    render(data);
  } catch {
    document.getElementById('updated').textContent = 'Connection error';
  }
}

function reload() { load(); }

document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.body.classList.contains('theme-light') ? 'dark' : 'light';
  setTheme(next);
});

function isMarketHours() {
  const h = new Date().getHours();
  return h >= 9 && h < 18;
}

initTheme();
load();
setInterval(() => { if (isMarketHours()) load(); }, 60000);
</script>
</body>
</html>
